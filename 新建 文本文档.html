<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI NPC 智能对话版（无重复/无undefined）</title>
    <style>
        * {margin:0;padding:0;box-sizing: border-box;font-family: "微软雅黑", sans-serif;}
        body {background: #1d2939;padding: 20px;color:#fff;}
        .game-box {width: 1000px;margin:0 auto;border: 2px solid #6b7280;border-radius: 8px;background: #111827;padding:15px;}
        .npc-select {margin-bottom:15px;padding:10px;background:#27272a;border-radius:6px;}
        .npc-select button {padding:8px 15px;margin:0 5px;border:none;border-radius:4px;background:#3b82f6;color:#fff;cursor:pointer;}
        .npc-select button:hover {background:#2563eb;}
        .npc-info {padding:10px;background:#0f172a;border-radius:6px;margin-bottom:15px;line-height:1.8;}
        .dialog-box {width:100%;height:350px;border:1px solid #6b7280;border-radius:6px;padding:10px;background:#030712;overflow-y:auto;margin-bottom:15px;}
        .dialog-item {margin-bottom:10px;padding:8px;border-radius:6px;max-width:90%;}
        .player-dialog {background:#3b82f6;margin-left:auto;text-align:right;}
        .npc-dialog {background:#4b5563;margin-right:auto;text-align:left;}
        .api-tip {padding:10px;background:#f59e0b;border-radius:6px;margin-bottom:15px;color:#111;}
        .input-box {display:flex;gap:10px;margin-bottom:15px;}
        #playerInput {flex:1;padding:10px;border:1px solid #6b7280;border-radius:6px;background:#1f2937;color:#fff;font-size:16px;outline:none;}
        #sendBtn {padding:0 20px;border:none;border-radius:6px;background:#10b981;color:#fff;cursor:pointer;font-size:16px;}
        #sendBtn:hover {background:#059669;}
        .func-panel {display:flex;gap:10px;margin-bottom:15px;}
        .func-panel button {flex:1;padding:12px;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:16px;}
        #collectBtn {background:#84cc16;}
        #mineBtn {background:#b45309;}
        #fightBtn {background:#ef4444;}
        .status-panel {display:flex;gap:15px;padding:10px;background:#27272a;border-radius:6px;}
        .status-item {flex:1;line-height:1.8;}
        b {color:#fbbf24;}
    </style>
</head>
<body>
    <div class="game-box">
        <div class="api-tip">
            📌 智能对话版 | 无重复话术 | 无undefined | 支持自由提问
        </div>
        <div class="input-box" style="margin-bottom:15px;">
            <input type="text" id="apiKeyInput" placeholder="请输入你的火山方舟API-KEY（免费获取）" style="flex:1;">
        </div>
        <div class="npc-select">
            <button onclick="changeNPC('liya')">✅ 绿洲之城 - 莉娅(采集/炼金·温柔)</button>
            <button onclick="changeNPC('senen')">⛏️ 绿叶精灵城 - 森恩(挖矿/锻造·粗犷)</button>
            <button onclick="changeNPC('huoke')">⚔️ 边境小镇 - 霍克(战斗/狩猎·沉稳)</button>
        </div>
        <div class="npc-info" id="npcInfo">
            <b>当前NPC：</b>绿洲之城 - 莉娅<br>
            <b>性格：</b>活泼温柔 | <b>擅长：</b>采集、炼金 | <b>口头禅：</b>呀，这个药草超稀有呢！
        </div>
        <div class="dialog-box" id="dialogBox">
            <div class="dialog-item npc-dialog">你好呀～我是莉娅，有什么想问我的都可以说哦，比如「哪里采集稀有药草？」「炼金需要什么材料？」✨</div>
        </div>
        <div class="input-box">
            <input type="text" id="playerInput" placeholder="在这里输入你想对NPC说的话，比如：哪里采集药草？、挖矿能出什么矿石？、哥布林怎么打？">
            <button id="sendBtn" onclick="sendMsg()">发送对话</button>
        </div>
        <div class="func-panel">
            <button id="collectBtn" onclick="doCollect()">🌿 采集药草</button>
            <button id="mineBtn" onclick="doMine()">⛰️ 挖掘矿石</button>
            <button id="fightBtn" onclick="doFight()">⚔️ 战斗打怪</button>
        </div>
        <div class="status-panel">
            <div class="status-item">
                <b>当前BUFF状态：</b><span id="buffStatus">无BUFF</span><br>
                <b>BUFF剩余时间：</b><span id="buffTime">0 秒</span>
            </div>
            <div class="status-item">
                <b>绿洲声望：</b><span id="shengwangLiya">0</span><br>
                <b>绿叶声望：</b><span id="shengwangSenen">0</span><br>
                <b>边境声望：</b><span id="shengwangHuoke">0</span>
            </div>
            <div class="status-item">
                <b>药草数量：</b><span id="herbNum">0</span><br>
                <b>矿石数量：</b><span id="oreNum">0</span><br>
                <b>角色经验：</b><span id="expNum">0</span>
            </div>
        </div>
    </div>

    <script>
        let playerData = {herb:0,ore:0,exp:0,shengwang:{liya:0,senen:0,huoke:0},buff:{name:"",active:false,time:0,effect:""},memory:[],memoryMax:5};
        // ✅ 优化NPC配置：增加「智能兜底回复库」，避免重复
        const NPC_CONFIG = {
            liya:{
                name:"绿洲之城 - 莉娅",
                personality:"活泼温柔、热心肠",
                specialty:"采集各种药草、制作疗伤药水、辨识稀有草药",
                mantra:"呀，这个药草超稀有呢！",
                buff:{name:"采集幸运",effect:"稀有药草概率+30%，采集经验翻倍",duration:120},
                buffKeys:["采集","药草","炼金","草药","药水"],
                // ✅ 莉娅的智能兜底回复库（根据玩家提问方向匹配）
                replies: [
                    "城外的晨曦森林里药草最多啦，尤其是小溪边的薄荷草，超好用～",
                    "采集稀有药草要在清晨去哦，那时的露水能让药草品质更好～",
                    "炼金需要先收集3株薄荷草+1个露水，我可以教你做初级疗伤药水～",
                    "小心森林里的小松鼠，它们会偷药草哦，带点坚果就能赶走它们啦～",
                    "你的采药等级够高的话，能挖到百年人参，卖给商会能赚好多金币呢～"
                ]
            },
            senen:{
                name:"绿叶精灵城 - 森恩",
                personality:"粗犷直爽、讲义气",
                specialty:"挖掘各种矿石、锻造武器装备、辨识矿脉位置",
                mantra:"好矿！锻出来的装备肯定顶！",
                buff:{name:"挖矿暴击",effect:"矿石数量×2，挖矿经验翻倍",duration:120},
                buffKeys:["挖矿","矿石","锻造","矿洞","装备"],
                // ✅ 森恩的智能兜底回复库
                replies: [
                    "西边的黑石山矿洞矿石最纯，铁矿、铜矿都有，就是要小心落石～",
                    "挖矿记得带镐子，破损的镐子挖不出好矿，我这有备用的～",
                    "锻造铁剑需要5块铁矿+2块木炭，锻出来的剑砍哥布林超顺手～",
                    "深层矿洞有秘银矿，但是有矿鼠怪守着，等级够了再去！",
                    "矿石要趁热锻造，不然会脆，我教你怎么控制火候～"
                ]
            },
            huoke:{
                name:"边境小镇 - 霍克",
                personality:"沉默寡言、沉稳可靠、战斗经验丰富",
                specialty:"狩猎怪物、传授战斗技巧、辨识怪物弱点",
                mantra:"记住，怪物的弱点永远在破绽处。",
                buff:{name:"弱点翻倍",effect:"怪物弱点伤害×2，战斗经验翻倍",duration:120},
                buffKeys:["战斗","打怪","哥布林","史莱姆","弱点","狩猎"],
                // ✅ 霍克的智能兜底回复库
                replies: [
                    "哥布林的弱点在膝盖，攻击那里能让它直接倒地～",
                    "史莱姆怕火，带个火把就能轻松对付，别用剑砍，会黏住～",
                    "狩猎兽人要组队，它们的斧头砍人超疼，先躲再反击～",
                    "你的战斗等级提升后，能挑战狼王，掉落的狼牙能做护身符～",
                    "战斗前记得检查装备，破损的铠甲可挡不住怪物的攻击～"
                ]
            }
        };
        let currentNPC = "liya";let buffTimer = null;
        // ✅ 火山方舟最新有效接口地址
        const API_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";

        // ✅ 通用状态更新函数（不变）
        function updateStatus(){
            document.getElementById("herbNum").innerText=playerData.herb;
            document.getElementById("oreNum").innerText=playerData.ore;
            document.getElementById("expNum").innerText=playerData.exp;
            document.getElementById("shengwangLiya").innerText=playerData.shengwang.liya;
            document.getElementById("shengwangSenen").innerText=playerData.shengwang.senen;
            document.getElementById("shengwangHuoke").innerText=playerData.shengwang.huoke;
            if(playerData.buff.active){
                document.getElementById("buffStatus").innerText=playerData.buff.name+" | "+playerData.buff.effect;
                document.getElementById("buffTime").innerText=playerData.buff.time+" 秒";
            }else{
                document.getElementById("buffStatus").innerText="无BUFF";
                document.getElementById("buffTime").innerText="0 秒";
            }
        }

        // ✅ 优化对话添加函数（不变）
        function addDialog(content,isPlayer){
            let dialogBox = document.getElementById("dialogBox");
            let dialogItem = document.createElement("div");
            dialogItem.className = isPlayer ? "dialog-item player-dialog" : "dialog-item npc-dialog";
            // ✅ 过滤undefined，确保内容不为空
            dialogItem.innerText = content || "（NPC歪头思考中...）";
            dialogBox.appendChild(dialogItem);
            dialogBox.scrollTop = dialogBox.scrollHeight;
        }

        // ✅ BUFF函数（不变）
        function addBuff(buffCfg){
            if(buffTimer) clearInterval(buffTimer);
            playerData.buff = {
                name: buffCfg.name,
                active: true,
                time: buffCfg.duration,
                effect: buffCfg.effect
            };
            updateStatus();
            buffTimer = setInterval(()=>{
                playerData.buff.time--;
                updateStatus();
                if(playerData.buff.time <= 0){
                    clearInterval(buffTimer);
                    playerData.buff.active = false;
                    updateStatus();
                    addDialog(`【系统】你的「${buffCfg.name}」BUFF失效啦，可以再找NPC聊一聊重新获得哦～`,false);
                }
            },1000);
        }

        // ✅ 优化记忆函数：记住更多玩家提问关键词
        function addMemory(keyword){
            if(!playerData.memory.includes(keyword) && keyword.length>1){
                playerData.memory.push(keyword);
                if(playerData.memory.length>playerData.memoryMax){
                    playerData.memory.shift();
                }
            }
        }

        // ===== 核心修复：智能对话逻辑（消除undefined+告别重复话术）=====
        async function sendMsg() {
            let inputDom = document.getElementById("playerInput");
            let apiKey = document.getElementById("apiKeyInput").value.trim();
            let playerMsg = inputDom.value.trim();
            
            // 空输入判断
            if(!playerMsg) {
                addDialog("【提示】请输入你想对NPC说的话～", false);
                return;
            }
            // 无API-KEY判断
            if(!apiKey) {
                addDialog("【提示】请先输入你的火山方舟API-KEY（免费注册获取）", false);
                return;
            }

            // 添加玩家对话
            addDialog(playerMsg, true);
            inputDom.value = "";
            addDialog("【NPC正在思考...】", false);

            let npc = NPC_CONFIG[currentNPC];
            // ✅ 优化Prompt：引导模型针对性回复，消除重复
            let prompt = `
                你现在是游戏NPC【${npc.name}】，性格${npc.personality}，擅长${npc.specialty}。
                玩家现在问你：${playerMsg}
                要求：
                1. 完全符合${npc.name}的人设，语气要和${npc.personality}一致；
                2. 根据玩家的具体问题针对性回复，不要说无关的话；
                3. 回复要自然、口语化，像真实NPC聊天一样，不要太官方；
                4. 可以适当加入一点点可爱/粗犷/沉稳的语气词，比如莉娅用「～」，森恩用「！」，霍克用「。」；
                5. 回复长度控制在1-3句话，不要太长；
                6. 玩家之前问过的话题：${playerData.memory.join("、")}，可以适当呼应，但不要重复。
            `.trim();

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`,
                        "Accept": "*/*",
                        "Accept-Encoding": "gzip, deflate, br",
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                    },
                    body: JSON.stringify({
                        model: "doubao-multimodal-pro", // 或用doubao-pro，都可以
                        messages: [{role: "user", content: prompt}],
                        temperature: 0.9, // ✅ 提高随机性，避免重复回复
                        max_tokens: 300
                    })
                });

                if(!response.ok) throw new Error(`接口状态码：${response.status}`);
                const result = await response.json();
                
                // ✅ 步骤1：安全解析AI返回结果，消除undefined
                let aiReply = "";
                if(result && result.choices && result.choices[0] && result.choices[0].message && result.choices[0].message.content){
                    aiReply = result.choices[0].message.content.trim();
                }

                // ✅ 步骤2：AI返回为空时，从NPC的回复库中随机选一个，避免重复
                if(!aiReply || aiReply.length < 5){
                    const randomIdx = Math.floor(Math.random() * npc.replies.length);
                    aiReply = npc.replies[randomIdx];
                }

                // ✅ 步骤3：自然拼接口头禅（只在回复末尾加，且只加一次，避免强制重复）
                let finalReply = aiReply;
                if(!finalReply.includes(npc.mantra)){
                    // 根据NPC性格调整口头禅位置
                    if(currentNPC === "liya") finalReply += " " + npc.mantra;
                    if(currentNPC === "senen") finalReply += " " + npc.mantra;
                    if(currentNPC === "huoke") finalReply += " " + npc.mantra;
                }

                // 移除加载提示，添加最终回复
                document.getElementById("dialogBox").lastChild.remove();
                addDialog(finalReply, false);

                // ✅ 步骤4：提取玩家提问关键词，更新记忆，让后续回复更精准
                const keywords = playerMsg.split(/[，。！？、\s]/).filter(word => word.length>1);
                keywords.forEach(key => addMemory(key));

                // ✅ 触发BUFF逻辑（不变）
                let matchKey = npc.buffKeys.find(key => playerMsg.includes(key));
                if(matchKey){
                    addBuff(npc.buff);
                    playerData.shengwang[currentNPC] += 3;
                    updateStatus();
                }

            } catch (error) {
                // ✅ 报错时也用NPC的兜底回复，避免重复/undefined
                document.getElementById("dialogBox").lastChild.remove();
                const randomIdx = Math.floor(Math.random() * npc.replies.length);
                const errorReply = npc.replies[randomIdx] + " " + npc.mantra;
                addDialog(`【小提示】${errorReply}`, false);
                console.log("对话错误：", error); // 控制台查看详细错误，不影响玩家体验
            }
        }

        // ✅ 采集/挖矿/战斗函数（优化提示语，更丰富）
        function doCollect(){
            let herbNum = 1;
            let expNum = 5;
            let isRare = false;
            if(playerData.buff.active && playerData.buff.name === "采集幸运"){
                herbNum = 2;
                expNum = 10;
                if(Math.random() < 0.3){
                    isRare = true;
                    herbNum += 1;
                    expNum += 20;
                    addDialog(`【采集】✨ 哇！触发稀有药草！获得×${herbNum}药草，额外经验+20！`,false);
                }
            }
            if(!isRare){
                addDialog(`【采集】你在晨曦森林采集到了×${herbNum}株薄荷草，经验+${expNum}～`,false);
            }
            playerData.herb += herbNum;
            playerData.exp += expNum;
            updateStatus();
        }

        function doMine(){
            let oreNum = 1;
            let expNum = 5;
            if(playerData.buff.active && playerData.buff.name === "挖矿暴击"){
                oreNum = 2;
                expNum = 10;
                addDialog(`【挖矿】💥 挖矿暴击！挖到了×${oreNum}块铁矿，经验+${expNum}！`,false);
            }else{
                addDialog(`【挖矿】你在黑石山矿洞挖到了×${oreNum}块铜矿，经验+${expNum}～`,false);
            }
            playerData.ore += oreNum;
            playerData.exp += expNum;
            updateStatus();
        }

        function doFight(){
            let expNum = 10;
            const monsters = ["哥布林","史莱姆","兽人小兵","野猪"];
            const randomMonster = monsters[Math.floor(Math.random() * monsters.length)];
            if(playerData.buff.active && playerData.buff.name === "弱点翻倍"){
                expNum = 20;
                addDialog(`【战斗】⚔️ 精准命中${randomMonster}的弱点！打赢了它，经验+${expNum}！`,false);
            }else{
                addDialog(`【战斗】你击败了${randomMonster}，获得经验+${expNum}～`,false);
            }
            playerData.exp += expNum;
            updateStatus();
        }

        // ✅ 优化NPC切换逻辑：切换时提示更丰富
        function changeNPC(npcKey){
            currentNPC = npcKey;
            const npc = NPC_CONFIG[npcKey];
            document.getElementById("npcInfo").innerHTML = 
                `<b>当前NPC：</b>${npc.name}<br>
                <b>性格：</b>${npc.personality} | <b>擅长：</b>${npc.specialty} | <b>口头禅：</b>${npc.mantra}`;
            // 切换NPC的欢迎语更个性化
            const welcomeWords = {
                liya: `你切换到了【${npc.name}】，我超懂药草的，有什么想问的都可以说哦～`,
                senen: `你切换到了【${npc.name}】，挖矿锻造我最在行，尽管问！`,
                huoke: `你切换到了【${npc.name}】，战斗的事，问我就对了。`
            };
            addDialog(welcomeWords[npcKey] || `你切换到了【${npc.name}】，有什么问题都可以问我哦～`,false);
            // 清空记忆，避免和上一个NPC的话题混淆
            playerData.memory = [];
        }

        // 页面加载初始化
        window.onload=function(){
            updateStatus();
            document.getElementById("playerInput").onkeydown=e=>{
                if(e.keyCode === 13) sendMsg();
            };
        };
    </script>
</body>
</html>
